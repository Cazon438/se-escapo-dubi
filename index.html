.walk-steps{font-size:31px;white-space:nowrap;animation:walkbounce .45s ease-in-out infinite}.mini-card strong{font-size:14px}
@keyframes walkfade{0%{opacity:0}18%{opacity:1}80%{opacity:1}100%{opacity:0}}@keyframes walkbounce{50%{transform:translateX(10px) translateY(-5px)}}
.travel-cover{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#25536b,#071925 75%);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;padding:20px;color:#f4f8ed;text-align:center}
.travel-sky{height:180px;position:relative;width:min(90vw,550px);overflow:hidden}.travel-stars{position:absolute;inset:0;background-image:radial-gradient(#fff6c0 1px,transparent 1px);background-size:24px 20px;animation:scrollstars .7s linear infinite;opacity:.7}
.travel-path{position:absolute;left:0;right:0;bottom:19px;border-bottom:5px dashed #f9d481;opacity:.75}
.travel-vehicle{position:absolute;left:-20%;bottom:23px;font-size:66px;filter:drop-shadow(0 9px 7px #0006);animation:busmove 1.85s ease-in-out forwards}
.travel-destination{position:relative;margin-top:10px}.travel-destination span{letter-spacing:.23em;font-size:13px;color:#84dcca;font-weight:900}.travel-destination h2{font-size:clamp(35px,9vw,62px);margin:9px 0;line-height:1.05;letter-spacing:-.05em}.travel-destination p{margin:5px 0 12px;color:#d0e6e4}.travel-destination small{display:block;color:#f5d88c}.travel-destination button{margin-top:32px;min-width:138px}
@keyframes scrollstars{to{background-position:-24px 0}}@keyframes busmove{0%{left:-20%;transform:translateY(8px)}60%{transform:translateY(-4px)}100%{left:105%;transform:translateY(8px)}}
@media(max-width:600px){.scenic{height:190px}.province-desc{font-size:12px;padding:11px 13px}.simple-clues p{font-size:13px}.travel-sky{height:150px}.travel-vehicle{font-size:55px}.city-card{padding:10px;min-height:145px}.city-icon{height:68px}.city-card strong{font-size:15px}}
@media(max-width:350px){.city-grid{gap:8px}.city-card{padding:8px}.portrait{width:53px;height:53px}}
@media(prefers-reduced-motion:reduce){.travel-stars,.travel-vehicle,.walk-steps{animation:none!important}.travel-vehicle{left:45%}.mini-transition{animation:none!important}}

/* v5 · Dificultad calculada para cada ruta aleatoria */
.difficulty-pick{width:100%;max-width:430px;margin:0 0 17px}
.difficulty-title{display:block;margin:0 0 8px;color:#e3f4ec;font-size:13px;font-weight:850;letter-spacing:.025em}
.difficulty-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.difficulty-choice{min-height:74px;background:#103544;border:1px solid #557883;color:var(--light);border-radius:12px;padding:9px 5px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;text-align:center}
.difficulty-choice strong{font-size:14px}.difficulty-choice small{font-size:10px;color:#c2d4d6}
.difficulty-choice.active{background:#2b5048;border:2px solid var(--yellow);box-shadow:inset 0 0 0 1px #f9c96733}
.difficulty-choice.active strong{color:#ffe39a}
@media(max-width:360px){.difficulty-grid{gap:6px}.difficulty-choice{padding:8px 2px;min-height:69px}.difficulty-choice strong{font-size:13px}.difficulty-choice small{font-size:9px}}
@media(min-width:760px) and (max-height:850px){
 .app{max-width:1150px}.scenic{height:178px}.building{min-height:113px}.building .emoji{font-size:35px}.panel-pad{padding:18px 22px}.game-header{margin-bottom:12px}.actions-row{margin-top:12px}
}
@media(min-width:760px){.city-grid{max-width:950px}.witness-card{max-width:950px}}
</style>

function leadQuestions(rng,nextCity,clue){const kind=MAIN_CLUE_CATEGORY(clue);const extras=EXTRA_CLUES[nextCity.id];const pool=shuffle(rng,extras.filter(e=>e.category!==kind));const selected=pool.length>=2?pool.slice(0,2):shuffle(rng,extras).slice(0,2);return selected.map((extra,i)=>({id:`q${i}`,label:pick(rng,MAIN_QUESTION_TEXT[extra.category]),answer:pick(rng,[`También mencionó ${extra.text}.`,`Sí, recuerdo que hablaba de ${extra.text}.`,`Me acuerdo de otra cosa: ${extra.text}.`]),cost:pick(rng,[10,15,20,25]),category:extra.category}));}
function cityWrongDialog(rng,city){const msg=pick(rng,SAME_PROVINCE);return withAccent(rng,city.province,msg);}
function createScene(rng,city,isRoute,nextCity,isFinal){
 const themed=shuffle(rng,BUILDING_LOCAL[city.province]||['kiosco','cafe','hotel']);
 const picks=[BUILDINGS.find(b=>b[0]===themed[0]),...shuffle(rng,BUILDINGS.filter(b=>b[0]!==themed[0])).slice(0,2)];
 const choices=shuffle(rng,picks);
 const realIndex=isRoute?Math.floor(rng()*3):-1;
 const clue=nextCity?pick(rng,nextCity.hints):null;
 const buildings=choices.map((entry,i)=>{
  const [id,name,icon]=entry,p=pick(rng,PEOPLE),face=personFaceCode(rng),lead=i===realIndex;
  let intro,questions=[];
  if(lead&&isFinal){intro=withAccent(rng,city.province,pick(rng,FINAL_LINES));questions=optionalQuestions(rng,[['¿Está bien Dubi?','Sí, tomó agua, está tranquilo y lo cuidamos todo el tiempo.'],['¿Hizo alguna travesura?','Quiso llevarse una servilleta, pero lo convencimos con una caricia.'],['¿Intentó escaparse otra vez?','No, ahora está descansando y esperando que lo vengas a buscar.']],2);}
  else if(lead){
   const event=pick(rng,DUBI_EVENTS);
   intro=withAccent(rng,city.province,pick(rng,[`Vi a Dubi pasar por acá. ${event.action} ${event.departure} ${event.talker} comentó algo sobre ${clue}.`,`Sí, vi a ese husky. ${event.action} ${event.departure} ${event.talker} hablaba de ${clue}.`,`Me acuerdo del husky. ${event.action} ${event.departure} Escuché que ${event.talker.toLowerCase()} hablaba de ${clue}.`]));
   questions=leadQuestions(rng,nextCity,clue);
  } else if(isRoute){
   intro=withAccent(rng,city.province,pick(rng,CITY_DECOY));
   questions=optionalQuestions(rng,SIDE_QUESTIONS,pick(rng,[1,2]));
  } else {
   intro=withAccent(rng,city.province,pick(rng,WRONG_PROVINCE));
   questions=optionalQuestions(rng,SIDE_QUESTIONS,pick(rng,[1,2]));
  }
  const nearbyIntro=cityWrongDialog(rng,city),nearbyQuestions=optionalQuestions(rng,NEAR_QUESTIONS,pick(rng,[1,2]));
  const wrongIntro=withAccent(rng,city.province,pick(rng,WRONG_PROVINCE));
  const wrongQuestions=optionalQuestions(rng,WRONG_QUESTIONS,pick(rng,[1,2]));
  return {id,name,icon,person:p[0],face,lead,final:lead&&isFinal,intro,questions,nearbyIntro,nearbyQuestions,wrongIntro,wrongQuestions,clue:lead?clue:null,note:lead&&!isFinal?`${city.id==='home'?'Buenos Aires':city.city}: Dubi siguió a alguien que mencionó ${clue}.`:lead&&isFinal?`${city.city}: Dubi está a salvo.`:null};
 });

}
const DIFFICULTIES={facil:{label:'Fácil',caption:'Más tiempo · 4 destinos',factor:1,choices:4},medio:{label:'Medio',caption:'Menos tiempo · 10 destinos',factor:.55,choices:10},dificil:{label:'Difícil',caption:'Tiempo justo · 24 destinos',factor:.24,choices:24}};
function validDifficulty(name){return Object.hasOwn(DIFFICULTIES,name)?name:'facil';}
function gameTimeBudget(route,correctTravel,difficulty){
  // Costo real del recorrido: todos los viajes y una entrevista necesaria por parada.
  // El margen se ajusta a la cantidad de paradas; siempre queda tiempo para completar la ruta.
  const indispensable=correctTravel+route.length*12;
  const extraEasy=(route.length-1)*4*60+12*60-route.length*12;
  const level=validDifficulty(difficulty);
  if(level==='facil')return indispensable+extraEasy; // Exactamente el tiempo de la V4.
  const factor=DIFFICULTIES[level].factor;
  return indispensable+Math.ceil(extraEasy*factor/15)*15;
}
// Las opciones se crean por etapa, una única vez. Una provincia errónea no las vuelve a sortear.
function createTravelChoices(seed,route,difficulty){
 const count=DIFFICULTIES[validDifficulty(difficulty)].choices;
 return route.slice(0,-1).map((fromId,stage)=>{
  const targetProvince=loc(route[stage+1]).province;
  if(count===PROVINCES.length)return [...PROVINCES];
  const originProvince=loc(fromId).province;
  const distractors=PROVINCES.filter(name=>name!==targetProvince&&name!==originProvince);
  const stepRng=rngFromSeed((seed^Math.imul(stage+1,0x9e3779b1)^0xd081fea7)>>>0);
  return shuffle(stepRng,[targetProvince,...shuffle(stepRng,distractors).slice(0,count-1)]);
 });
}
function availableProvinces(){

 return choices||createTravelChoices(state.seed,state.route,state.difficulty)[state.stage]||[];
}
function provinceResults(query=''){

 const regions=Object.entries(REGION).map(([name,values])=>({name,values:values.filter(p=>allowed.has(p)&&(p.toLocaleLowerCase('es').includes(search)||CITIES.some(c=>c.province===p&&c.city.toLocaleLowerCase('es').includes(search))))})).filter(r=>r.values.length);
 return regions.map(r=>`<section class="region"><h3>${r.name}</h3><div class="province-grid">${provinceCards(r.values)}</div></section>`).join('')||'<p class="muted">No se encontró ese destino.</p>';
}
function generateGame(seed,difficulty='facil'){difficulty=validDifficulty(difficulty);const rng=rngFromSeed(seed),routeLength=4+Math.floor(rng()*4);let provinces=shuffle(rng,PROVINCES).slice(0,routeLength);let route=[START.id,...provinces.map(p=>pick(rng,CITIES.filter(c=>c.province===p)).id)];
const scenes={};for(const place of DESTINATIONS){const i=route.indexOf(place.id);scenes[place.id]=createScene(rng,place,i>=0,i>=0&&i<route.length-1?loc(route[i+1]):null,i===route.length-1);}
const correctTravel=route.slice(1).reduce((s,to,i)=>s+travelCost(loc(route[i]),loc(to)),0);
return {version:4,seed,route,scenes,travelChoices:createTravelChoices(seed,route,difficulty),wrongProvinceAlerted:{},difficulty,minutes:gameTimeBudget(route,correctTravel,difficulty),status:'playing',location:START.id,stage:0,visited:{},asked:{},stageVisited:{},stageAsked:{},events:[],lead:{} ,travelCount:0,wrongTravels:0,questionsCount:0,notes:{},started:Date.now()};}
let selectedDifficulty='facil';
let state=null,screen='intro',selected=null,mapProvince=null,mapQuery='',travelPending=null,travelTimer=null,miniTimer=null,noticeTimer=null,noticeDelay=null;
function migrateLegacyState(game){
 // Respeta una partida V5 ya comenzada; las visitas nuevas quedan asociadas a su etapa.
 if(!Array.isArray(game.travelChoices)||game.travelChoices.length!==game.route.length-1){
  game.travelChoices=createTravelChoices(game.seed,game.route,game.difficulty);
 }
 if(game.stageVisited&&game.stageAsked)return game;
 game.stageVisited={};game.stageAsked={};game.events=game.events||[];
 for(const [key,value] of Object.entries(game.visited||{}))if(value){
  const cityId=key.split('|')[0],index=game.route.indexOf(cityId);
  const stage=index>=0&&index<=game.stage?index:game.stage;
  game.stageVisited[`${stage}|${key}`]=true;
 }
 for(const [key,value] of Object.entries(game.asked||{}))if(value){
  const cityId=key.split('|')[0],index=game.route.indexOf(cityId);
  const stage=index>=0&&index<=game.stage?index:game.stage;
  game.stageAsked[`${stage}|${key}`]=true;
 }
 return game;
}
function stored(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return x&&x.version===4&&x.state&&x.state.version===4&&Array.isArray(x.state.route)&&x.state.route[0]==='home'&&x.state.scenes?migrateLegacyState(x.state):null;}catch(e){return null;}}
function reportEvent(type,info={}){if(!state)return;state.events=state.events||[];state.events.push({type,step:state.stage,city:state.location,remaining:state.minutes,...info});if(state.events.length>200)state.events.splice(0,state.events.length-200);}
function fallbackWrong(city,b){let hash=2166136261;for(const letter of `${state.seed}|${city.id}|${b.id}`){hash=Math.imul(hash^letter.charCodeAt(0),16777619);}const rng=rngFromSeed(hash>>>0);return {intro:withAccent(rng,city.province,pick(rng,WRONG_PROVINCE)),questions:optionalQuestions(rng,WRONG_QUESTIONS,pick(rng,[1,2]))};}
function downloadDiagnostic(){if(!state)return;const report={game:'Se escapó Dubi',build:'v5.1',seed:state.seed,difficulty:state.difficulty,stage:state.stage,location:state.location,route:state.route,minutes:state.minutes,notes:state.notes,events:state.events||[],visited:state.stageVisited||{},travelChoices:state.travelChoices||[]};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='dubi-diagnostico.json';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);}

function newGame(){removeProvinceNotice();let seed=freshSeed(),game=generateGame(seed,selectedDifficulty),old=state?.route.join('|');for(let tries=0;tries<5&&game.route.join('|')===old;tries++){seed=freshSeed();game=generateGame(seed,selectedDifficulty);}state=game;screen='investigar';selected=null;mapProvince=null;mapQuery='';persist();pushView();sfx('start');render();window.scrollTo(0,0);}
function pad(n){return String(n).padStart(2,'0')}
function minutesLabel(min){return `${Math.floor(min/60)} h ${pad(min%60)} min`}
function shortTime(min){return `${Math.floor(min/60)}h ${pad(min%60)}m`}
function kmBetween(a,b){const rad=x=>x*Math.PI/180,R=6371,p=rad(b.lat-a.lat),l=rad(b.lon-a.lon);const x=Math.sin(p/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(l/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function travelCost(from,to){return Math.min(10*60,Math.max(55,Math.round((50+kmBetween(from,to)/250*60)/15)*15));}
function inCorrectPlace(){return state&&state.location===state.route[state.stage]}
function inWrongCityRightProvince(city){const target=state&&state.route[state.stage+1];return !!target&&city.id!==target&&city.id!==state.route[state.stage]&&city.province===loc(target).province;}
function isWrongProvince(city){const target=state&&state.route[state.stage+1];return !!target&&city.id!==state.route[state.stage]&&city.province!==loc(target).province;}
function witnessForCity(city,b){

 if(inCorrectPlace())return b;
 if(inWrongCityRightProvince(city))return {...b,intro:b.nearbyIntro,questions:b.nearbyQuestions,lead:false,clue:null,note:null,final:false};
 // Nunca usar los diálogos de una etapa futura o pasada en una provincia errónea.
 const fallback=b.wrongIntro?null:fallbackWrong(city,b);
 return {...b,intro:b.wrongIntro||fallback.intro,questions:b.wrongQuestions||fallback.questions,lead:false,clue:null,note:null,final:false};
}

function currentVisitKey(id){return `${state.stage}|${state.location}|${id}`;}
function hasVisited(id){return !!state.stageVisited?.[currentVisitKey(id)];}
function hasAsked(id){return !!state.stageAsked?.[`${state.stage}|${state.location}|${selected||''}|${id}`];}
function spend(cost){if(!state||state.status!=='playing')return false;state.minutes=Math.max(0,state.minutes-cost);if(state.minutes<=0){state.status='lost';screen='fin';selected=null;sfx('wrong');persist();render();return false;}persist();return true;}

function onThirdWrongProvinceWitness(city){const key=`${state.stage}|${city.id}`;if(!isWrongProvince(city)||state.wrongProvinceAlerted?.[key])return;const visited=state.scenes[city.id].buildings.filter(b=>hasVisited(b.id)).length;if(visited!==3)return;state.wrongProvinceAlerted=state.wrongProvinceAlerted||{};state.wrongProvinceAlerted[key]=true;reportEvent('provincia_equivocada');persist();noticeDelay=setTimeout(()=>showProvinceNotice(city.id),610);}

function investigationHTML(){const city=loc(state.location),scene=state.scenes[city.id],seen=!!state.lead[city.id];return `<main>${gameHeader(`Buscá a Dubi en ${city.city}`,city.province)}<div class="main-grid"><div><section class="card">${provinceScene(city)}<div class="panel-pad"><h2 class="section-title">¿Dónde investigamos?</h2><div class="building-grid">${scene.buildings.map(b=>`<button class="building ${selected===b.id?'active':''} ${hasVisited(b.id)?'visited':''}" data-action="building" data-id="${b.id}"><span class="emoji">${b.icon}</span><strong>${esc(b.name)}</strong><small>${hasVisited(b.id)?'Visitado':'(+12 min)'}</small></button>`).join('')}</div>${selected?dialogHTML(witnessForCity(city,scene.buildings.find(b=>b.id===selected))):''}</div></section><div class="actions-row">${atFinal()&&seen?`<button class="primary" data-action="finish">❤️ ¡Ahí está Dubi!</button>`:`<button class="primary" data-action="map">🗺️ Viajar</button>`}<button class="secondary" data-action="journal">📔 Pistas</button></div></div></div></main>`;}
function provinceCards(list){return list.map(p=>`<button class="province" data-action="province" data-to="${esc(p)}"><span class="province-icon">📍</span><span><strong>${esc(p)}</strong><small>Elegir ciudad</small></span></button>`).join('');}
function mapHTML(){if(mapProvince){const cities=CITIES.filter(c=>c.province===mapProvince);return `<main>${gameHeader(mapProvince,'Elegí una ciudad')}<div class="city-grid">${cities.map(c=>`<button class="city-card ${c.id===state.location?'current':''}" data-action="travel" data-to="${c.id}" ${c.id===state.location?'disabled':''}><div class="city-icon">${sceneArt(SCENE_TYPES[c.province])}</div><strong>${esc(c.city)}</strong><small>${c.id===state.location?'📍 Estás acá':`(+${shortTime(travelCost(loc(state.location),c))})`}</small></button>`).join('')}</div></main>`;}
const showSearch=availableProvinces().length>10;
return `<main>${gameHeader('¿A dónde viajamos?','Elegí una provincia')}${showSearch?`<input class="search" id="province-filter" placeholder="🔎 Buscar provincia o ciudad" aria-label="Buscar provincia o ciudad" autocomplete="off" value="${esc(mapQuery)}">`:''}<div id="provinces">${provinceResults(mapQuery)}</div></main>`;}
function journalHTML(){const lines=Object.entries(state.notes);return `<main>${gameHeader('Mis pistas','')}<section class="card"><div class="panel-pad"><div class="simple-clues">${lines.length?lines.map(([id,note])=>`<p>${esc(note)}</p>`).join(''):'<p class="muted">Todavía no anotaste nada.</p>'}</div><button class="diag-download" data-action="diagnostic">⬇ Descargar diagnóstico</button></div></section></main>`;}
function endHTML(){const won=state.status==='won';return `<main><section class="end"><div class="kicker">${won?'¡Misión cumplida!':'El reloj llegó a cero'}</div><img src="${DUBI_PHOTO}" alt="Dubi, el husky protagonista"><h1>${won?'🐾 ¡Encontraste a Dubi!':'🐕 ¡Dubi sigue de paseo!'}</h1><p>${won?'Después de recorrer medio país, ahí está: moviendo la cola y con esa cara de «yo no hice nada». ¡A casa, Dubi!':'Esta vez se acabó el tiempo. Pero Dubi está bien: alguien lo vio descansando en un lugar seguro. ¡Intentá de nuevo!'}</p><div class="end-stats"><div><strong>${state.stage+1}/${state.route.length}</strong><small>Paradas</small></div><div><strong>${state.questionsCount}</strong><small>Preguntas</small></div><div><strong>${state.wrongTravels}</strong><small>Desvíos</small></div></div>${won?`<p style="color:var(--yellow);font-weight:900">⏱️ Te sobraron ${minutesLabel(state.minutes)}.</p>`:''}<button class="primary" data-action="setup">🐾 Otra escapada</button></section></main>`;}
function dockHTML(){if(!state||state.status!=='playing'||screen==='intro')return '';return `<nav class="dock" aria-label="Navegación del juego"><button class="${screen==='investigar'?'sel':''}" data-action="investigar"><span class="di">🏪</span> Investigar</button><button class="${screen==='mapa'?'sel':''}" data-action="map"><span class="di">🗺️</span> Viajar</button><button class="${screen==='bitacora'?'sel':''}" data-action="journal"><span class="di">📔</span> Pistas</button></nav>`;}
function render(){let out=header();if(screen==='intro'||!state){out+=introHTML();}else if(state.status!=='playing'){out+=endHTML();}else if(screen==='mapa'){out+=mapHTML();}else if(screen==='bitacora'){out+=journalHTML();}else{out+=investigationHTML();}out+=dockHTML();$('app').innerHTML=out;}
window.addEventListener('popstate',e=>{removeMini();removeProvinceNotice();if(travelPending){clearTimeout(travelTimer);travelPending=null;$('travel-cover')?.remove();}const prev=e.state;if(prev?.dubi){screen=prev.screen==='viaje'?'mapa':prev.screen;selected=screen==='investigar'?prev.selected||null:null;mapProvince=screen==='mapa'?prev.mapProvince||null:null;}else{screen=state?'investigar':'intro';selected=null;mapProvince=null;history.replaceState({dubi:true,screen,selected,mapProvince},'','#'+screen);}render();window.scrollTo(0,0);});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const act=btn.dataset.action;if(act==='sound'){soundEnabled=!soundEnabled;try{localStorage.setItem('se-dubi-sound',soundEnabled?'on':'off');}catch(e){}if(soundEnabled)sfx('click');render();return;}if(act==='difficulty'){selectedDifficulty=validDifficulty(btn.dataset.level);sfx('click');render();return;}if(act==='setup'){removeProvinceNotice();screen='intro';selected=null;mapProvince=null;pushView();sfx('click');render();window.scrollTo(0,0);return;}if(act==='start'){newGame();return;}if(act==='resume'){screen='investigar';selected=null;pushView();render();return;}if(act==='building'){revealBuilding(btn.dataset.id);return;}if(act==='question'){askQuestion(btn.dataset.id);return;}if(act==='province'){chooseProvince(btn.dataset.to);return;}if(act==='travel'){travel(btn.dataset.to);return;}if(act==='skiptravel'){completeTravel();return;}if(act==='dismisswrong'){removeProvinceNotice();return;}if(act==='diagnostic'){downloadDiagnostic();return;}if(act==='finish'){finish();return;}if(act==='map'){navigate('mapa');return;}if(act==='investigar'){navigate('investigar');return;}if(act==='journal'){navigate('bitacora');return;}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#wrong-province-notice'))removeProvinceNotice();});
document.addEventListener('input',e=>{if(e.target.id==='province-filter'){
 mapQuery=e.target.value;const box=$('provinces');if(box)box.innerHTML=provinceResults(mapQuery);
}});
state=stored();if(state){selectedDifficulty=validDifficulty(state.difficulty);screen=state.status==='playing'?'investigar':'fin';history.replaceState({dubi:true,screen:'intro',selected:null,mapProvince:null},'','#inicio');pushView();}else{screen='intro';history.replaceState({dubi:true,screen:'intro',selected:null,mapProvince:null},'','#inicio');}render();

</script>
</body>
</html>
